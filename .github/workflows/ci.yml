name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        # `ray lint` only validates a per-extension package-lock.json when CI=true, because
        # the Raycast Store requires one per extension folder. This is an npm workspace: the
        # single lockfile lives at the repo root and is what `npm ci` installs from, so the
        # check does not apply. Every other validation still runs.
        env:
          CI: "false"
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
