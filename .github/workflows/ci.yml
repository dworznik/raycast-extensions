name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        # `ray lint` only validates a per-extension lockfile when CI=true, because
        # the Raycast Store requires one per extension folder. This is a pnpm
        # workspace: the single lockfile lives at the repo root and is what
        # `pnpm install` works from, so the check does not apply. Every other
        # validation still runs.
        env:
          CI: "false"
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
