packages:
  - extensions/*

# One version per dependency for the whole repo; the packages reference these
# with "catalog:" so the two extensions cannot drift apart.
catalog:
  "@raycast/api": ^2.4.1
  "@raycast/eslint-config": ^2.2.0
  "@raycast/utils": ^2.3.1
  "@types/node": 26.6.1
  "@types/react": 19.3.0
  eslint: ^10.11.0
  prettier: ^3.9.8
  react: 19.3.0
  typescript: ^7.0.2
  vitest: ^5.0.1

# esbuild's postinstall unpacks the platform binary that `ray build` runs on.
allowBuilds:
  esbuild: true
